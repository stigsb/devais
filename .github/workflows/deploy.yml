name: Generate STL and Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Python dependencies
        run: |
          uv sync

      - name: Generate enclosure and full assembly
        run: |
          uv run cad-generate
          uv run cad-assembly

      # PCB artifacts are optional for the site; a tsci failure must not block STL publishing.
      - name: Install PCB toolchain
        continue-on-error: true
        run: |
          cd hardware/pcb && bun install --frozen-lockfile

      - name: Generate PCB artifacts
        continue-on-error: true
        run: |
          uv run pcb-export
          uv run python3 hardware/pcb/generate_assembly.py

      - name: Create deployment directory
        run: |
          mkdir -p deploy
          cp web/index.html web/viewer.html deploy/
          cp output/full-assembly/*_print.stl deploy/
          cp output/fit_pins.stl output/fit_sockets.stl deploy/
          cp hardware/pcb/index.circuit-pcb.svg hardware/pcb/index.circuit-schematic.svg hardware/pcb/assembly-top.svg deploy/ || true
          ls -la deploy

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
