name: Generate STL and Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Python dependencies
        run: |
          uv sync

      - name: Install PCB toolchain
        run: |
          npm install -g @tscircuit/cli
          cd hardware/pcb && npm install

      - name: Generate enclosure STL
        run: |
          uv run python cad/enclosure.py

      - name: Generate PCB artifacts
        run: |
          uv run pcb-export
          uv run python3 hardware/pcb/generate_assembly.py

      - name: Create deployment directory
        run: |
          mkdir -p deploy
          cp cad/output/enclosure.stl deploy/
          cp cad/output/enclosure_left.stl deploy/
          cp cad/output/enclosure_right.stl deploy/
          cp cad/output/large_button.stl deploy/
          cp hardware/pcb/index.circuit-pcb.svg deploy/
          cp hardware/pcb/index.circuit-schematic.svg deploy/
          cp hardware/pcb/assembly-top.svg deploy/
          cp web/index.html deploy/
          cp web/enclosure.html deploy/
          cp web/enclosure_left.html deploy/
          cp web/enclosure_right.html deploy/
          cp web/large_button.html deploy/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
