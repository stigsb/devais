[project]
name = "devais"
version = "0.1.0"
description = "Handheld AI Assistant Device - 3D CAD design and firmware"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cadquery>=2.8.0",
    "pillow>=10.0.0",
    "pyrender>=0.1.45",
    "trimesh>=4.11.2",
]

[project.scripts]
cad-generate = "cad.enclosure:main"
cad-preview = "cad.preview:main"
pcb-build = "hardware.pcb_build:build"
pcb-export = "hardware.pcb_build:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cad", "hardware"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
]
